<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TeleChats - Login</title>
    
    <!-- Load Eruda for Debugging -->
    <script src="https://cdn.jsdelivr.net/npm/eruda"></script>
    <script>eruda.init();</script>

    <!-- Load Modern Unique Font (Plus Jakarta Sans) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">

    <!-- 1. Load Supabase SDK -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    
    <!-- 2. Load your separate database configuration -->
    <script src="supabase.js"></script>

    <style>
        * {
            -webkit-tap-highlight-color: transparent;
            -webkit-touch-callout: none;
            user-select: none;
            outline: none;
            font-family: 'Plus Jakarta Sans', sans-serif;
        }

        body { 
            background: #ffffff; 
            margin: 0; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            height: 100vh; 
            box-sizing: border-box;
        }
        
        .login-container { 
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: 100%; 
            max-width: 360px; 
            padding: 20px; 
            box-sizing: border-box; 
            text-align: center; 
        }

        .app-logo {
            width: 110px;
            height: 110px;
            border-radius: 50%;
            object-fit: cover;
            margin-bottom: 35px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.12);
            border: 1px solid rgba(0, 0, 0, 0.08);
        }

        .google-btn { 
            background: #ffffff; 
            color: #333333; 
            border: 1px solid #e1e4e8; 
            padding: 14px 20px; 
            font-size: 15px; 
            font-weight: 600; 
            border-radius: 14px; 
            cursor: pointer; 
            width: 100%; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            gap: 12px; 
            box-shadow: 0 4px 15px rgba(0,0,0,0.04); 
            transition: all 0.2s ease; 
            outline: none !important;
        }
        
        .google-btn:hover, .google-btn:focus, .google-btn:active { 
            background: #f8f9fa; 
            border-color: #d1d5db;
            outline: none !important;
        }

        .saved-accounts {
            margin-top: 30px;
            width: 100%;
            border-top: 1px solid #f0f2f5;
            padding-top: 20px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .saved-title {
            font-size: 13px;
            color: #8e8e93;
            margin-bottom: 4px;
            font-weight: 700;
            text-align: left;
            letter-spacing: 0.5px;
            text-transform: uppercase;
        }

        .account-card {
            display: flex;
            align-items: center;
            background: #f8f9fa;
            border: 1px solid #eef0f2;
            padding: 10px 14px;
            border-radius: 14px;
            cursor: pointer;
            transition: all 0.2s ease;
            text-align: left;
            position: relative;
        }

        .account-card:hover {
            background: #f1f3f5;
            border-color: #e2e8f0;
        }

        .account-avatar {
            width: 42px;
            height: 42px;
            border-radius: 50%;
            object-fit: cover;
            margin-right: 12px;
        }

        .account-info {
            flex-grow: 1;
            overflow: hidden;
        }

        .account-name {
            font-size: 14px;
            font-weight: 700;
            color: #1f2937;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .account-email {
            font-size: 12px;
            color: #6b7280;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            font-weight: 500;
        }

        .remove-account {
            background: none;
            border: none;
            color: #9ca3af;
            font-size: 20px;
            cursor: pointer;
            padding: 6px;
            line-height: 1;
            transition: color 0.2s;
        }

        .remove-account:hover {
            color: #ef4444;
        }

        .loading-overlay {
            position: fixed;
            top: 0; 
            left: 0; 
            width: 100%; 
            height: 100%;
            background: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 2000;
        }

        .loading-box {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
        }

        .loading-logo {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            object-fit: cover;
            box-shadow: 0 6px 20px rgba(0,0,0,0.08);
            border: 1px solid rgba(0, 0, 0, 0.06);
            animation: pulse-logo 1.5s infinite ease-in-out;
        }

        .loading-text {
            font-size: 15px;
            font-weight: 600;
            color: #4b5563;
            letter-spacing: 0.2px;
        }

        .dots-loader {
            display: flex;
            gap: 6px;
        }

        .dots-loader span {
            width: 9px;
            height: 9px;
            background-color: #2563eb;
            border-radius: 50%;
            display: inline-block;
            animation: bounce 1.4s infinite ease-in-out both;
        }

        .dots-loader span:nth-child(1) { animation-delay: -0.32s; }
        .dots-loader span:nth-child(2) { animation-delay: -0.16s; }

        .cancel-btn {
            margin-top: 15px;
            background: #f3f4f6;
            color: #4b5563;
            border: 1px solid #d1d5db;
            padding: 8px 16px;
            font-size: 13px;
            font-weight: 600;
            border-radius: 8px;
            cursor: pointer;
        }
        .cancel-btn:hover {
            background: #e5e7eb;
        }

        @keyframes bounce {
            0%, 80%, 100% { transform: scale(0); }
            40% { transform: scale(1.0); }
        }

        @keyframes pulse-logo {
            0%, 100% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.05); opacity: 0.85; }
        }
    </style>
</head>
<body>

    <div class="login-container">
        <img src="logo.png" alt="TeleChats Logo" class="app-logo" onerror="this.src='https://via.placeholder.com/150'">
        
        <button class="google-btn" onclick="loginWithGoogle()">
            <svg width="18" height="18" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48"><path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/><path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/><path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/><path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.46-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/></svg>
            Sign in with Google
        </button>

        <div id="savedAccountsSection" class="saved-accounts" style="display: none;">
            <div class="saved-title">Recent Accounts</div>
            <div id="accountsList"></div>
        </div>
    </div>

    <!-- Default loader with Cancel button -->
    <div id="loadingOverlay" class="loading-overlay" style="display: flex;">
        <div class="loading-box">
            <img src="logo.png" alt="Loading Logo" class="loading-logo" onerror="this.src='https://via.placeholder.com/150'">
            <div class="dots-loader">
                <span></span>
                <span></span>
                <span></span>
            </div>
            <div id="loadingText" class="loading-text">Loading TeleChats...</div>
            <button id="cancelLoaderBtn" class="cancel-btn" style="display: none;" onclick="cancelLoading()">Cancel / Retry</button>
        </div>
    </div>

    <script>
        function setLoadingText(text, showCancel = false) {
            const textEl = document.getElementById('loadingText');
            if (textEl) textEl.textContent = text;
            const cancelBtn = document.getElementById('cancelLoaderBtn');
            if (cancelBtn) cancelBtn.style.display = showCancel ? 'block' : 'none';
        }

        function hideLoader() {
            const overlay = document.getElementById('loadingOverlay');
            if (overlay) overlay.style.display = 'none';
        }

        function cancelLoading() {
            hideLoader();
            loadSavedAccounts();
        }

        function saveUserToDatabase(user) {
            if (!user) return;
            try {
                const email = user.email;
                const name = user.user_metadata?.full_name || user.user_metadata?.name || email.split('@')[0];
                const avatar = user.user_metadata?.avatar_url || user.user_metadata?.picture || 'https://via.placeholder.com/150';

                let savedAccounts = JSON.parse(localStorage.getItem('telechats_saved_accounts') || '[]');
                savedAccounts = savedAccounts.filter(acc => acc.email !== email);
                savedAccounts.unshift({ email, name, avatar });
                localStorage.setItem('telechats_saved_accounts', JSON.stringify(savedAccounts));
            } catch (e) {
                console.error('Error saving user data:', e);
            }
        }

        async function handleAuthenticatedUser(user) {
            setLoadingText('Syncing database...');
            saveUserToDatabase(user);
            await new Promise(resolve => setTimeout(resolve, 300)); 

            setLoadingText('Entering chat...');
            window.location.href = 'chat_screen.html';
        }

        async function processAuthUrl(url) {
            // FIXED: Check for 'callback' or 'chat_screen.html' to properly handle incoming deep links
            if (url && (url.includes('callback') || url.includes('chat_screen.html'))) {
                const hashIndex = url.indexOf('#');
                if (hashIndex !== -1) {
                    const hash = url.substring(hashIndex + 1);
                    const params = new URLSearchParams(hash);
                    const access_token = params.get('access_token');
                    const refresh_token = params.get('refresh_token');

                    if (access_token && refresh_token && typeof supabase !== 'undefined') {
                        setLoadingText('Setting up session...');
                        const { data, error } = await supabase.auth.setSession({ access_token, refresh_token });
                        if (!error && data?.user) {
                            await handleAuthenticatedUser(data.user);
                            return true;
                        } else {
                            hideLoader();
                            alert('Session Error: ' + (error ? error.message : 'Unknown error'));
                        }
                    }
                }
            }
            return false;
        }

        async function initApp() {
            try {
                setLoadingText('Checking session...');

                if (typeof supabase === 'undefined') {
                    throw new Error('Supabase SDK failed to load.');
                }

                // 1. Check deep link launch URL
                if (window.Capacitor && window.Capacitor.Plugins && window.Capacitor.Plugins.App) {
                    window.Capacitor.Plugins.App.addListener('appUrlOpen', async (event) => {
                        await processAuthUrl(event.url);
                    });

                    try {
                        const launchData = await window.Capacitor.Plugins.App.getLaunchUrl();
                        if (launchData && launchData.url) {
                            const handled = await processAuthUrl(launchData.url);
                            if (handled) return;
                        }
                    } catch (e) {
                        console.log('Launch URL check skipped:', e);
                    }
                }

                // 2. Check standard existing active session
                const { data: { session }, error } = await supabase.auth.getSession();
                if (session && session.user && !error) {
                    await handleAuthenticatedUser(session.user);
                } else {
                    loadSavedAccounts();
                    hideLoader();
                }
            } catch (err) {
                console.error('Init error:', err);
                loadSavedAccounts();
                hideLoader();
            }
        }

        function loadSavedAccounts() {
            try {
                const savedAccounts = JSON.parse(localStorage.getItem('telechats_saved_accounts') || '[]');
                const section = document.getElementById('savedAccountsSection');
                const list = document.getElementById('accountsList');

                if (savedAccounts.length > 0 && section && list) {
                    section.style.display = 'flex';
                    list.innerHTML = '';

                    savedAccounts.forEach((acc, index) => {
                        list.innerHTML += `
                            <div class="account-card" onclick="loginWithHint('${acc.email}')">
                                <img src="${acc.avatar}" alt="Avatar" class="account-avatar" onerror="this.src='https://via.placeholder.com/150'">
                                <div class="account-info">
                                    <div class="account-name">${acc.name}</div>
                                    <div class="account-email">${acc.email}</div>
                                </div>
                                <button class="remove-account" onclick="removeAccount(event, ${index})">&times;</button>
                            </div>
                        `;
                    });
                } else if (section) {
                    section.style.display = 'none';
                }
            } catch (e) {
                console.error('Error loading saved accounts:', e);
            }
        }

        function removeAccount(event, index) {
            event.stopPropagation();
            try {
                let savedAccounts = JSON.parse(localStorage.getItem('telechats_saved_accounts') || '[]');
                savedAccounts.splice(index, 1);
                localStorage.setItem('telechats_saved_accounts', JSON.stringify(savedAccounts));
                loadSavedAccounts();
            } catch (e) {
                console.error('Error removing account:', e);
            }
        }

        async function loginWithGoogle(emailHint = null) {
            const overlay = document.getElementById('loadingOverlay');
            if (overlay) overlay.style.display = 'flex';
            setLoadingText('Connecting to Google...', true);

            try {
                if (typeof supabase === 'undefined') {
                    alert('Database client not loaded.');
                    hideLoader();
                    return;
                }

                const queryParams = {};
                if (emailHint) {
                    queryParams.login_hint = emailHint; 
                } else {
                    queryParams.prompt = 'select_account'; 
                }

                // FIXED: Use telechats://callback for native mobile deep linking
                const redirectUrl = (window.Capacitor && window.Capacitor.isNativePlatform())
                    ? 'telechats://callback'
                    : window.location.origin + '/chat_screen.html';

                const { data, error } = await supabase.auth.signInWithOAuth({
                    provider: 'google',
                    options: {
                        redirectTo: redirectUrl,
                        queryParams: queryParams,
                        skipBrowserRedirect: true
                    }
                });

                if (error) {
                    hideLoader();
                    alert('Login Error: ' + error.message);
                    return;
                }

                if (data?.url) {
                    setLoadingText('Waiting for account...', true);
                    window.location.href = data.url;
                }
            } catch (err) {
                hideLoader();
                alert('Exception during login: ' + err.message);
            }
        }

        function loginWithHint(email) {
            loginWithGoogle(email);
        }

        initApp();
    </script>
</body>
</html>
