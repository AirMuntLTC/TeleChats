<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TeleChats - Login</title>
    
    <!-- Load Modern Unique Font (Plus Jakarta Sans) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">

    <!-- 1. Load Supabase SDK -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    
    <!-- 2. Load your separate database configuration -->
    <script src="supabase.js"></script>

    <style>
        /* Apply unique modern font to everything and remove mobile tap artifacts */
        * {
            -webkit-tap-highlight-color: transparent;
            -webkit-touch-callout: none;
            user-select: none;
            outline: none;
            font-family: 'Plus Jakarta Sans', sans-serif;
        }

        body { 
            background: #ffffff; 
            margin: 0; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            height: 100vh; 
            box-sizing: border-box;
        }
        
        .login-container { 
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: 100%; 
            max-width: 360px; 
            padding: 20px; 
            box-sizing: border-box; 
            text-align: center; 
        }

        .app-logo {
            width: 110px;
            height: 110px;
            border-radius: 50%;
            object-fit: cover;
            margin-bottom: 35px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.12);
            border: 1px solid rgba(0, 0, 0, 0.08);
        }

        .google-btn { 
            background: #ffffff; 
            color: #333333; 
            border: 1px solid #e1e4e8; 
            padding: 14px 20px; 
            font-size: 15px; 
            font-weight: 600; 
            border-radius: 14px; 
            cursor: pointer; 
            width: 100%; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            gap: 12px; 
            box-shadow: 0 4px 15px rgba(0,0,0,0.04); 
            transition: all 0.2s ease; 
            outline: none !important;
        }
        
        .google-btn:hover, .google-btn:focus, .google-btn:active { 
            background: #f8f9fa; 
            border-color: #d1d5db;
            outline: none !important;
        }

        /* Messenger-style Saved Accounts Section */
        .saved-accounts {
            margin-top: 30px;
            width: 100%;
            border-top: 1px solid #f0f2f5;
            padding-top: 20px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .saved-title {
            font-size: 13px;
            color: #8e8e93;
            margin-bottom: 4px;
            font-weight: 700;
            text-align: left;
            letter-spacing: 0.5px;
            text-transform: uppercase;
        }

        .account-card {
            display: flex;
            align-items: center;
            background: #f8f9fa;
            border: 1px solid #eef0f2;
            padding: 10px 14px;
            border-radius: 14px;
            cursor: pointer;
            transition: all 0.2s ease;
            text-align: left;
            position: relative;
        }

        .account-card:hover {
            background: #f1f3f5;
            border-color: #e2e8f0;
        }

        .account-avatar {
            width: 42px;
            height: 42px;
            border-radius: 50%;
            object-fit: cover;
            margin-right: 12px;
        }

        .account-info {
            flex-grow: 1;
            overflow: hidden;
        }

        .account-name {
            font-size: 14px;
            font-weight: 700;
            color: #1f2937;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .account-email {
            font-size: 12px;
            color: #6b7280;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            font-weight: 500;
        }

        .remove-account {
            background: none;
            border: none;
            color: #9ca3af;
            font-size: 20px;
            cursor: pointer;
            padding: 6px;
            line-height: 1;
            transition: color 0.2s;
        }

        .remove-account:hover {
            color: #ef4444;
        }

        /* Solid Fullscreen Loading Overlay Styles */
        .loading-overlay {
            position: fixed;
            top: 0; 
            left: 0; 
            width: 100%; 
            height: 100%;
            background: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 2000;
        }

        .loading-box {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
        }

        .loading-logo {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            object-fit: cover;
            box-shadow: 0 6px 20px rgba(0,0,0,0.08);
            border: 1px solid rgba(0, 0, 0, 0.06);
            animation: pulse-logo 1.5s infinite ease-in-out;
        }

        .loading-text {
            font-size: 15px;
            font-weight: 600;
            color: #4b5563;
            letter-spacing: 0.2px;
        }

        .dots-loader {
            display: flex;
            gap: 6px;
        }

        .dots-loader span {
            width: 9px;
            height: 9px;
            background-color: #2563eb;
            border-radius: 50%;
            display: inline-block;
            animation: bounce 1.4s infinite ease-in-out both;
        }

        .dots-loader span:nth-child(1) { animation-delay: -0.32s; }
        .dots-loader span:nth-child(2) { animation-delay: -0.16s; }

        @keyframes bounce {
            0%, 80%, 100% { transform: scale(0); }
            40% { transform: scale(1.0); }
        }

        @keyframes pulse-logo {
            0%, 100% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.05); opacity: 0.85; }
        }
    </style>
</head>
<body>

    <div class="login-container">
        <!-- Logo Image -->
        <img src="logo.png" alt="TeleChats Logo" class="app-logo">
        
        <!-- Google Login Button -->
        <button class="google-btn" onclick="loginWithGoogle()">
            <svg width="18" height="18" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48"><path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/><path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/><path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/><path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.46-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/></svg>
            Sign in with Google
        </button>

        <!-- Dynamic Saved Accounts List -->
        <div id="savedAccountsSection" class="saved-accounts" style="display: none;">
            <div class="saved-title">Recent Accounts</div>
            <div id="accountsList"></div>
        </div>
    </div>

    <!-- Solid Fullscreen Loading Overlay with Logo & Animation -->
    <div id="loadingOverlay" class="loading-overlay" style="display: none;">
        <div class="loading-box">
            <img src="logo.png" alt="Loading Logo" class="loading-logo">
            <div class="dots-loader">
                <span></span>
                <span></span>
                <span></span>
            </div>
            <div class="loading-text">Waiting for account...</div>
        </div>
    </div>

    <script>
        // Check if user is already logged in, redirect to chat room
        async function checkSession() {
            const { data: { session } } = await supabase.auth.getSession();
            if (session) {
                window.location.href = 'chat_screen.html';
            }
        }
        checkSession();

        // Load saved accounts on start
        function loadSavedAccounts() {
            const savedAccounts = JSON.parse(localStorage.getItem('telechats_saved_accounts') || '[]');
            const section = document.getElementById('savedAccountsSection');
            const list = document.getElementById('accountsList');

            if (savedAccounts.length > 0) {
                section.style.display = 'flex';
                list.innerHTML = '';

                savedAccounts.forEach((acc, index) => {
                    list.innerHTML += `
                        <div class="account-card" onclick="loginWithHint('${acc.email}')">
                            <img src="${acc.avatar}" alt="Avatar" class="account-avatar" onerror="this.src='https://via.placeholder.com/150'">
                            <div class="account-info">
                                <div class="account-name">${acc.name}</div>
                                <div class="account-email">${acc.email}</div>
                            </div>
                            <button class="remove-account" onclick="removeAccount(event, ${index})">&times;</button>
                        </div>
                    `;
                });
            } else {
                section.style.display = 'none';
            }
        }
        loadSavedAccounts();

        // Remove single saved account
        function removeAccount(event, index) {
            event.stopPropagation();
            let savedAccounts = JSON.parse(localStorage.getItem('telechats_saved_accounts') || '[]');
            savedAccounts.splice(index, 1);
            localStorage.setItem('telechats_saved_accounts', JSON.stringify(savedAccounts));
            loadSavedAccounts();
        }

        // Trigger Google OAuth Login (with Fullscreen loading for both buttons and hints)
        async function loginWithGoogle(emailHint = null) {
            // Show loading overlay immediately when any sign-in route is triggered
            document.getElementById('loadingOverlay').style.display = 'flex';

            const queryParams = {};

            if (emailHint) {
                queryParams.login_hint = emailHint; 
            } else {
                queryParams.prompt = 'select_account'; 
            }

            const { error } = await supabase.auth.signInWithOAuth({
                provider: 'google',
                options: {
                    redirectTo: window.location.origin + '/chat_screen.html',
                    queryParams: queryParams
                }
            });

            if (error) {
                // Hide loading overlay if an error occurs so the user isn't stuck
                document.getElementById('loadingOverlay').style.display = 'none';
                alert('Login Error: ' + error.message);
            }
        }

        function loginWithHint(email) {
            loginWithGoogle(email);
        }
    </script>
</body>
</html>
